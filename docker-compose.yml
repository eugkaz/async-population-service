version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: population_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d population_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app_base:
    build: .
    image: population_app
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db/population_db
      DATA_SOURCE: WIKIPEDIA 
    depends_on:
      db:
        condition: service_healthy

  get_data:
    extends: app_base
    command: python src/main.py get_data

  print_data:
    extends: app_base
    command: python src/main.py print_data